# ==============================================================================
# CodeCraft — Production-Ready Docker Compose Orchestration
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. Next.js Web Application & API Server
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.web
    container_name: codecraft-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_COLLAB_WS_URL=${NEXT_PUBLIC_COLLAB_WS_URL:-ws://localhost:1234}
      - NEXT_PUBLIC_COLLAB_HTTP_URL=http://collab:1234
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      # Persistent Git workspace repositories
      - codecraft_git_data:/app/data/git
      # Ephemeral container execution scratch space
      - codecraft_exec_data:/app/data/executions
      # Docker daemon socket for controlled sandbox container orchestration
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      collab:
        condition: service_healthy
    networks:
      - codecraft-net

  # ----------------------------------------------------------------------------
  # 2. Real-time Yjs CRDT Collaboration WebSocket Server
  # ----------------------------------------------------------------------------
  collab:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.collab
    container_name: codecraft-collab
    restart: unless-stopped
    ports:
      - "1234:1234"
    environment:
      - NODE_ENV=production
      - COLLAB_PORT=1234
      - COLLAB_HOST=0.0.0.0
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
    networks:
      - codecraft-net

networks:
  codecraft-net:
    driver: bridge

volumes:
  # Dedicated persistent volume for Git working trees & commit objects
  codecraft_git_data:
    name: codecraft_git_data
  # Ephemeral scratch volume for isolated code executions
  codecraft_exec_data:
    name: codecraft_exec_data
