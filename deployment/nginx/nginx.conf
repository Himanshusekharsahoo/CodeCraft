# ==============================================================================
# CodeCraft — Production Nginx Reverse Proxy & TLS Configuration
# Supports HTTPS termination, WSS WebSocket upgrading, and security headers
# ==============================================================================

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Upstreams
    upstream nextjs_upstream {
        server 127.0.0.1:3000;
        keepalive 32;
    }

    upstream collab_upstream {
        server 127.0.0.1:1234;
        keepalive 32;
    }

    # --------------------------------------------------------------------------
    # 1. HTTP -> HTTPS Redirect
    # --------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name codecraft.example.com collab.example.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --------------------------------------------------------------------------
    # 2. Main Web Application (HTTPS)
    # --------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name codecraft.example.com;

        # TLS Certificates (Provided via AWS ACM, Let's Encrypt, or Custom CA)
        ssl_certificate /etc/ssl/certs/codecraft.crt;
        ssl_certificate_key /etc/ssl/private/codecraft.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        client_max_body_size 10M;

        location / {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Health endpoint
        location /api/health {
            proxy_pass http://nextjs_upstream/api/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            access_log off;
        }
    }

    # --------------------------------------------------------------------------
    # 3. Dedicated Real-time Collaboration Server (WSS)
    # --------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name collab.example.com;

        ssl_certificate /etc/ssl/certs/codecraft.crt;
        ssl_certificate_key /etc/ssl/private/codecraft.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Collaboration WebSocket & HTTP Bridge
        location / {
            proxy_pass http://collab_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Long-lived WebSocket connection timeouts
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        location /health {
            proxy_pass http://collab_upstream/health;
            proxy_http_version 1.1;
            access_log off;
        }
    }
}
