AWSTemplateFormatVersion: '2010-09-09'
Description: 'CodeCraft Production Cloud Infrastructure: VPC, ALB, EC2 with Docker Sandbox, EBS Git Storage & IAM'

Parameters:
  EnvironmentName:
    Type: String
    Default: production
    Description: Deployment environment name

  InstanceType:
    Type: String
    Default: t3.large
    Description: EC2 instance type (minimum 2 vCPUs, 8GB RAM recommended for Docker Sandbox)

  AcmCertificateArn:
    Type: String
    Description: ARN of AWS ACM Certificate for HTTPS/WSS (leave blank if testing HTTP-only)
    Default: ''

  GitVolumeSizeGB:
    Type: Number
    Default: 50
    Description: EBS Volume size in GB for Git repositories and workspace persistence

Resources:
  # ============================================================================
  # 1. Network Topology (VPC, Subnets, Routing)
  # ============================================================================
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-codecraft-vpc'

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-codecraft-igw'

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-public-subnet-1'

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-public-subnet-2'

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-public-rt'

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  Subnet1RouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  Subnet2RouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  # ============================================================================
  # 2. Security Groups
  # ============================================================================
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for public Application Load Balancer
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-alb-sg'

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for CodeCraft application host
      VpcId: !Ref VPC
      SecurityGroupIngress:
        # Next.js web traffic from ALB only
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref AlbSecurityGroup
        # Collaboration WebSocket traffic from ALB only
        - IpProtocol: tcp
          FromPort: 1234
          ToPort: 1234
          SourceSecurityGroupId: !Ref AlbSecurityGroup
      SecurityGroupEgress:
        # Outbound egress for Firebase, Gemini API, and Docker image pulls
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-app-sg'

  # ============================================================================
  # 3. Application Load Balancer & Target Groups
  # ============================================================================
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${EnvironmentName}-codecraft-alb'
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      SecurityGroups:
        - !Ref AlbSecurityGroup
      Type: application
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-codecraft-alb'

  WebTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${EnvironmentName}-web-tg'
      Port: 3000
      Protocol: HTTP
      VpcId: !Ref VPC
      TargetType: instance
      HealthCheckPath: /api/health?type=liveness
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  CollabTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${EnvironmentName}-collab-tg'
      Port: 1234
      Protocol: HTTP
      VpcId: !Ref VPC
      TargetType: instance
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: '443'
            StatusCode: HTTP_301

  # ============================================================================
  # 4. IAM Least-Privilege Execution Role
  # ============================================================================
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # SSM for secure management without open SSH port 22
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: CodeCraftSecretsAndLogsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:codecraft/*'
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/codecraft/*'

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  # ============================================================================
  # 5. Persistent EBS Storage for Git Workspaces
  # ============================================================================
  GitEbsVolume:
    Type: AWS::EC2::Volume
    Properties:
      AvailabilityZone: !Select [0, !GetAZs '']
      Size: !Ref GitVolumeSizeGB
      VolumeType: gp3
      Encrypted: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-codecraft-git-ebs'

  # ============================================================================
  # 6. EC2 Production Instance with Docker Sandbox Support
  # ============================================================================
  AppInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      SubnetId: !Ref PublicSubnet1
      SecurityGroupIds:
        - !Ref AppSecurityGroup
      IamInstanceProfile: !Ref InstanceProfile
      ImageId: ami-0c101f26f147fa7fd # Amazon Linux 2023 (or region-specific AMI)
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-codecraft-server'
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e
          dnf update -y
          dnf install -y docker git
          systemctl enable --now docker
          usermod -aG docker ec2-user

          # Prepare EBS Mount for Git persistence
          mkdir -p /mnt/codecraft-git
          while [ ! -b /dev/xvdf ] && [ ! -b /dev/nvme1n1 ]; do sleep 2; done
          DEV_NAME=$(ls -1 /dev/xvdf /dev/nvme1n1 2>/dev/null | head -n 1)
          if ! blkid $DEV_NAME; then
            mkfs -t xfs $DEV_NAME
          fi
          mount $DEV_NAME /mnt/codecraft-git
          echo "$DEV_NAME /mnt/codecraft-git xfs defaults,nofail 0 2" >> /etc/fstab

  VolumeAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      InstanceId: !Ref AppInstance
      VolumeId: !Ref GitEbsVolume
      Device: /dev/xvdf

Outputs:
  AlbDnsName:
    Description: Application Load Balancer Public DNS Name
    Value: !GetAtt ApplicationLoadBalancer.DNSName
  InstanceId:
    Description: EC2 Host Instance ID
    Value: !Ref AppInstance
